[project]
name = "wifi-spectrum-gui"
version = "0.1.0"
description = "PC GUI prototype for an ESP32-C5 dual-band Wi-Fi spectrum analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13.7",
    "pyserial>=3.5",
    "numpy>=1.26",
]

[project.scripts]
wifi-spectrum = "wifi_spectrum.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ships the whole package directory, including wifi_spectrum/assets/*.svg
packages = ["wifi_spectrum"]

[tool.hatch.build.targets.sdist]
include = [
    "wifi_spectrum/",
    "README.md",
    "DESIGN.md",
    "docs/",
    "pyproject.toml",
    "uv.lock",
]

[tool.pyright]
# Mirror pyrightconfig.json so every analyzer entry point (including
# fallback runners that only read pyproject.toml) resolves the uv venv.
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
# Keep repository checks independent of a developer's user-level Ruff config.
select = ["E4", "E7", "E9", "F"]
