name: Static analysis and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python static analysis and package build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uvx ruff==0.16.10 check --config pyproject.toml wifi_spectrum/ tests/ scripts/
      - name: Type check
        run: uvx pyright==1.1.414 wifi_spectrum/ tests/ scripts/
      - name: Build GUI package
        run: uv build

  firmware:
    name: ESP32-C5 firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Build with ESP-IDF v6.0.3
        run: make build-podman
